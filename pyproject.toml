[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvim-retro-themes"
version = "0.1.0"
description = "Dark retro colorschemes for Neovim, derived from textual-themes and tuned for readability"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "Michael Blaess" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/michaelblaess/nvim-retro-themes"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nvim_retro_themes = ["data/*.json", "py.typed"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
